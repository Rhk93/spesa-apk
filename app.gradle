plugins { id 'com.android.application' }
def run = Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
android {
    namespace 'it.ricette.ig'
    compileSdk 34
    defaultConfig {
        applicationId 'it.ricette.ig'
        minSdk 24
        targetSdk 34
        versionCode run
        versionName "1.0.${run}"
    }
    signingConfigs {
        rel {
            storeFile file('release.jks')
            storePassword 'ricette123'
            keyAlias 'ricette'
            keyPassword 'ricette123'
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.rel }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
