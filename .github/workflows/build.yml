name: Crea APK Ricette IG
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Installa Android 34
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "Uso $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"
          echo "sdk.dir=$SDK" > local.properties
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
      - name: Sistema i file nelle cartelle
        run: |
          mkdir -p app/src/main/java/it/ricette/ig app/src/main/assets app/src/main/res/drawable
          cp app.gradle app/build.gradle
          cp release.jks app/release.jks
          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp ic_app.xml app/src/main/res/drawable/ic_app.xml
          cp MainActivity.java app/src/main/java/it/ricette/ig/MainActivity.java
          HTML=$(ls -1 | grep -i '^index.*\.htm' | head -1)
          if [ -z "$HTML" ]; then HTML=$(ls -1 | grep -i '\.htm' | head -1); fi
          if [ -z "$HTML" ]; then echo "MANCA index.html: caricalo nel repository"; ls -la; exit 1; fi
          echo "Uso $HTML"
          cp "$HTML" app/src/main/assets/index.html
      - name: Compila
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Pubblica la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Ricette IG 1.0.${{ github.run_number }}
          files: app/build/outputs/apk/release/app-release.apk
          make_latest: true
