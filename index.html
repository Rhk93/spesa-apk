<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f2f2f7">
<title>Spesa Dieta</title>
<style>
/* Layout: schermate iOS a liste raggruppate, titolo grande, barra schede in basso, sfondo personalizzabile dietro tutto. */
:root{
  --bg:#f2f2f7; --cell:#ffffff; --cell-t:rgba(255,255,255,.8); --label:#000000;
  --label2:rgba(60,60,67,.65); --label3:rgba(60,60,67,.3);
  --sep:rgba(60,60,67,.18); --tint:#34c759; --tint-text:#1f8a3a; --tint-weak:rgba(52,199,89,.15);
  --bad:#ff3b30; --bar:rgba(249,249,249,.86); --fill:rgba(120,120,128,.16); --scrim:rgba(0,0,0,.4);
  --veil-c:242,242,247; --good:#34c759;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --cell:#1c1c1e; --cell-t:rgba(28,28,30,.78); --label:#ffffff;
    --label2:rgba(235,235,245,.65); --label3:rgba(235,235,245,.3);
    --sep:rgba(84,84,88,.6); --tint:#30d158; --tint-text:#30d158; --tint-weak:rgba(48,209,88,.2);
    --bad:#ff453a; --bar:rgba(29,29,31,.86); --fill:rgba(120,120,128,.3); --scrim:rgba(0,0,0,.6);
    --veil-c:0,0,0; --good:#30d158; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --cell:#1c1c1e; --cell-t:rgba(28,28,30,.78); --label:#ffffff;
  --label2:rgba(235,235,245,.65); --label3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.6); --tint:#30d158; --tint-text:#30d158; --tint-weak:rgba(48,209,88,.2);
  --bad:#ff453a; --bar:rgba(29,29,31,.86); --fill:rgba(120,120,128,.3); --scrim:rgba(0,0,0,.6);
  --veil-c:0,0,0; --good:#30d158; color-scheme:dark;
}
html.hasbg{--cell:var(--cell-t)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
body{
  margin:0;background:var(--bg);color:var(--label);font:17px/1.3 var(--font);-webkit-font-smoothing:antialiased;
  padding-top:calc(14px + env(safe-area-inset-top,0px));
  padding-bottom:calc(120px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
button,input,textarea{font:inherit;color:inherit}
a{color:var(--tint-text)}
#bg{position:fixed;inset:0;z-index:-1;background-size:cover;background-position:center}
#bg::after{content:"";position:absolute;inset:0;background:rgba(var(--veil-c),var(--veil,.25))}
html:not(.hasbg) #bg{display:none}
html.hasbg .group,html.hasbg .card,html.hasbg .note{-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4)}
#app{max-width:640px;margin:0 auto}

.lt{margin:6px 0 10px}
.ltrow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.lt h1{margin:0;font-size:34px;line-height:1.1;font-weight:700;letter-spacing:.2px;text-wrap:balance}
.lt .sub{margin:4px 0 0;font-size:15px;color:var(--label2)}
.link{background:none;border:0;color:var(--tint-text);font-size:17px;padding:4px 0;cursor:pointer}

.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;margin:10px 0 6px}
.wd{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.wd small{font-size:11px;font-weight:600;color:var(--label2);text-transform:uppercase;letter-spacing:.04em}
.wd b{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:19px;font-weight:500;font-variant-numeric:tabular-nums}
.wd[aria-pressed="true"] b{background:var(--tint);color:#fff}
.wd[aria-pressed="true"] small{color:var(--tint-text)}

.prog{height:4px;border-radius:2px;background:var(--fill);overflow:hidden;margin:10px 2px 0}
.prog i{display:block;height:100%;background:var(--tint);border-radius:2px;transition:width .25s ease}

.gh{margin:24px 16px 6px;font-size:13px;font-weight:400;text-transform:uppercase;letter-spacing:.02em;color:var(--label2)}
html.hasbg .gh{color:var(--label)}
.group{background:var(--cell);border-radius:14px;overflow:hidden}
.row{position:relative;display:flex;align-items:center;gap:12px;padding:11px 16px;min-height:48px;transition:opacity .16s ease,transform .16s ease}
.row+.row::before{content:"";position:absolute;top:0;left:52px;right:0;height:.5px;background:var(--sep)}
.group.plain .row+.row::before,.row.ed+.row::before,.row.act::before,.row.act+.row::before,.row.fld+.row::before{left:16px}
.item{cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none}
.item:active{background:var(--fill)}
.item:focus-visible,.btn:focus-visible,.link:focus-visible,.tab:focus-visible,.wd:focus-visible,.act:focus-visible{outline:2px solid var(--tint);outline-offset:-2px}
.leaving{opacity:0;transform:translateX(10px)}
.txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.nm{overflow-wrap:anywhere}
.nt{font-size:13px;color:var(--label2);overflow-wrap:anywhere}
.qt{flex:none;color:var(--label2);font-variant-numeric:tabular-nums;text-align:right;max-width:45%}
.chk{flex:none;width:24px;height:24px;border-radius:50%;border:1.6px solid var(--label3);display:grid;place-items:center;transition:background .15s,border-color .15s}
.chk svg{width:14px;height:14px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.on .chk{background:var(--tint);border-color:var(--tint)}
.on .chk svg{opacity:1}
.on .nm{color:var(--label2);text-decoration:line-through}
.row.act{width:100%;border:0;background:none;color:var(--tint-text);text-align:left;cursor:pointer}
.row.act.bad{color:var(--bad)}
.okbadge{flex:none;width:28px;height:28px;border-radius:50%;background:var(--good);display:grid;place-items:center}
.okbadge svg{width:16px;height:16px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}

.row.ed{align-items:flex-start;padding:10px 16px 10px 12px}
.del{flex:none;width:24px;height:24px;margin-top:6px;border-radius:50%;border:0;background:var(--bad);color:#fff;font-size:18px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0}
.edf{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.edf input,.fld input[type=text],.fld input[type=password]{width:100%;border:0;border-radius:8px;background:var(--fill);padding:8px 10px;min-width:0}
.edf .r{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.edf .r input:last-child{grid-column:1 / -1}
.row.fld{flex-direction:column;align-items:stretch;gap:6px;padding:12px 16px}
.row.fld label{font-size:13px;color:var(--label2)}
input:focus-visible,#diet-text:focus-visible{outline:2px solid var(--tint)}

.card{background:var(--cell);border-radius:14px;padding:20px 18px;margin-top:18px}
.note{background:var(--tint-weak);border-radius:14px;padding:12px 14px;margin-top:14px;font-size:15px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
html.hasbg .note{background:var(--cell)}
.empty{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;padding:34px 20px}
.empty .ic{width:64px;height:64px;border-radius:16px;background:var(--tint-weak);color:var(--tint-text);display:grid;place-items:center}
.empty .ic svg,.sheet-ic svg{width:34px;height:34px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.empty h2{margin:4px 0 0;font-size:22px;font-weight:700}
.empty p,.muted{margin:0;color:var(--label2);font-size:15px}
.empty p{max-width:34ch}
.small-empty{color:var(--label2);text-align:center;padding:28px 12px;font-size:15px}
html.hasbg .small-empty{color:var(--label)}
.btn{display:block;width:100%;border:0;border-radius:14px;background:var(--tint);color:#fff;font-weight:600;font-size:17px;padding:15px 16px;text-align:center;cursor:pointer}
.btn.sec{background:var(--tint-weak);color:var(--tint-text)}
.btn.ghost{background:none;color:var(--tint-text);font-weight:400}
.stack{display:flex;flex-direction:column;gap:10px;width:100%}

#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bar);
  -webkit-backdrop-filter:blur(20px) saturate(1.8);backdrop-filter:blur(20px) saturate(1.8);
  border-top:.5px solid var(--sep);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
#tabbar .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{background:none;border:0;color:var(--label2);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:500;line-height:1.2;padding:4px 0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tab svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--tint-text)}

/* impostazioni: colori e sfondi */
.sw{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;justify-items:center;padding:14px 10px}
.sw button{width:46px;height:46px;border-radius:50%;border:0;cursor:pointer;padding:0;display:grid;place-items:center}
.sw button[aria-pressed="true"],.bgt[aria-pressed="true"]{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--tint)}
.sw svg,.bgt svg{width:20px;height:20px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0;filter:drop-shadow(0 0 1px rgba(0,0,0,.5))}
.sw button[aria-pressed="true"] svg,.bgt[aria-pressed="true"] svg.ck{opacity:1}
.bgs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:14px}
.bgt{height:74px;border-radius:14px;border:1px solid var(--sep);cursor:pointer;padding:0;display:grid;place-items:center;position:relative;overflow:hidden;background-size:cover;background-position:center;color:var(--label)}
.bgt span{position:absolute;left:8px;bottom:6px;font-size:12px;font-weight:600;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.bgt.flat span,.bgt.plus span{color:var(--label);text-shadow:none}
.bgt.plus svg{opacity:1;stroke:var(--label2);stroke-width:2}
.pick{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px}
.pick+.pick{border-top:.5px solid var(--sep)}
.pick input[type=color]{width:52px;height:34px;border:0;padding:0;background:none;cursor:pointer}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--fill);border-radius:10px;padding:2px;gap:2px;margin:12px 14px}
.seg button{border:0;background:none;border-radius:8px;padding:8px 4px;font-size:15px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--cell);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.18)}
html.hasbg .seg button[aria-pressed="true"]{background:var(--bar)}
.rng{padding:12px 16px 14px;display:flex;flex-direction:column;gap:8px}
.rng input{width:100%;accent-color:var(--tint)}
.rng label{display:flex;justify-content:space-between;font-size:15px}

#sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:var(--scrim)}
#sheet .sh{width:100%;max-width:640px;max-height:92%;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;
  padding:22px max(20px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.sh h3{margin:0;font-size:22px;font-weight:700;text-align:center}
.sh p{margin:0;font-size:15px;color:var(--label2);text-align:center}
.sheet-ic{align-self:center;width:64px;height:64px;border-radius:16px;background:var(--tint-weak);color:var(--tint-text);display:grid;place-items:center}
#diet-text{width:100%;min-height:180px;border:0;border-radius:12px;background:var(--cell);padding:12px;resize:vertical}
.spin{align-self:center;width:34px;height:34px;border-radius:50%;border:3px solid var(--fill);border-top-color:var(--tint);animation:rot .9s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none;border-right-color:var(--tint)}.row,.prog i{transition:none}}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--label);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:15px;max-width:min(90%,420px);text-align:center}
</style>
</head>
<body>
<div id="bg" aria-hidden="true"></div>
<div id="app"><main id="view" aria-live="polite"></main></div>

<nav id="tabbar" aria-label="Schede"><div class="in">
  <button class="tab" data-tab="spesa" aria-selected="true"><svg viewBox="0 0 24 24"><path d="M3 4h2.3l2.1 10.2a1.5 1.5 0 0 0 1.5 1.2h8.3a1.5 1.5 0 0 0 1.5-1.1L20.5 8H6.1"/><circle cx="9.7" cy="19" r="1.3"/><circle cx="17" cy="19" r="1.3"/></svg>Spesa</button>
  <button class="tab" data-tab="settimana" aria-selected="false"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Settimana</button>
  <button class="tab" data-tab="dieta" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M7 3v7M4.5 3v4.5a2.5 2.5 0 0 0 5 0V3M7 10v11M17 21V3c-2.2 1.6-3.5 4.4-3.5 8H17"/></svg>Dieta</button>
  <button class="tab" data-tab="impostazioni" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>Aspetto</button>
</div></nav>

<div id="sheet" hidden></div>
<div id="toast" hidden role="status"></div>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var DAY_NAMES=['lunedì','martedì','mercoledì','giovedì','venerdì','sabato','domenica'];
var DAY_SHORT=['Lun','Mar','Mer','Gio','Ven','Sab','Dom'];
var K_DATA='spesa-dieta-data-v1',K_CFG='spesa-dieta-cfg-v1',K_PHOTO='spesa-dieta-photo-v1';
var SW=[['Verde','#34c759'],['Blu','#007aff'],['Viola','#af52de'],['Rosa','#ff2d55'],['Arancione','#ff9500'],['Turchese','#30b0c7'],['Rosso','#e5352b'],['Grafite','#7d7d85']];
var GR=[['Aurora','linear-gradient(160deg,#a8edea,#fed6e3)'],['Tramonto','linear-gradient(160deg,#ff9a9e,#fad0c4 55%,#fbc2eb)'],['Oceano','linear-gradient(160deg,#667eea,#4facfe)'],['Bosco','linear-gradient(160deg,#11998e,#38ef7d)'],['Lavanda','linear-gradient(160deg,#a18cd1,#fbc2eb)'],['Pesca','linear-gradient(160deg,#ffecd2,#fcb69f)'],['Notte','linear-gradient(160deg,#0f2027,#203a43,#2c5364)'],['Grafite','linear-gradient(160deg,#4b4b4f,#0d0d0f)']];
var CHECK='<svg viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2L19 7"/></svg>';
var reduced=false;try{reduced=matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){}

var S={tab:'spesa',sel:0,diet:null,checks:{},edit:false,banner:false,sheet:null,err:''};
var C={accent:'#34c759',theme:'auto',bg:{type:'none',preset:0,c1:'#667eea',c2:'#4facfe'},veil:25};
var PHOTO='',ctl=null,toastT=null;

/* ---------- utilità ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function kOf(d){return (d.getDay()+6)%7}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dates(){var t=new Date();t.setHours(12,0,0,0);var a=[];for(var i=1;i<=7;i++){var d=new Date(t);d.setDate(t.getDate()+i);a.push(d)}return a}
function longDate(d){return d.toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'})}
function shortDate(d){return d.toLocaleDateString('it-IT',{day:'numeric',month:'short'})}
function fmtNum(n){return Number(n).toLocaleString('it-IT',{maximumFractionDigits:1})}
function qtyText(it){if(it.qty==null||it.qty==='') return 'q.b.';return fmtNum(it.qty)+(it.unit?' '+it.unit:'')}
function newId(){return 'i'+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3)}
function norm(s){return String(s||'').toLowerCase().replace(/\s+/g,' ').trim()}
function toast(m){var t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true},2800)}

/* ---------- salvataggio sul telefono ---------- */
function loadAll(){
  try{var d=JSON.parse(localStorage.getItem(K_DATA)||'null');if(d){S.diet=d.diet||null;S.checks=d.checks||{}}}catch(e){}
  try{var g=JSON.parse(localStorage.getItem(K_CFG)||'null');if(g){Object.keys(g).forEach(function(k){if(k==='bg'&&g.bg)C.bg=Object.assign(C.bg,g.bg);else C[k]=g[k]})}}catch(e){}
  try{PHOTO=localStorage.getItem(K_PHOTO)||''}catch(e){}
}
function saveData(){try{localStorage.setItem(K_DATA,JSON.stringify({diet:S.diet,checks:S.checks}))}catch(e){toast('Memoria piena: non riesco a salvare')}}
function saveCfg(){try{localStorage.setItem(K_CFG,JSON.stringify(C))}catch(e){}}
function prune(){var t=iso(new Date()),o={};Object.keys(S.checks).forEach(function(k){if(k.split('|')[0]>=t)o[k]=1});S.checks=o}

/* ---------- colori e sfondo ---------- */
function hexRgb(h){var m=/^#?([0-9a-f]{6})$/i.exec(h||'');if(!m) return null;var n=parseInt(m[1],16);return [(n>>16)&255,(n>>8)&255,n&255]}
function mix(c,t,a){return c.map(function(v,i){return Math.round(v*(1-a)+t[i]*a)})}
function rgb(c){return 'rgb('+c.join(',')+')'}
function bgCss(){
  var b=C.bg||{};
  if(b.type==='preset'&&GR[b.preset]) return GR[b.preset][1];
  if(b.type==='custom') return 'linear-gradient(160deg,'+b.c1+','+b.c2+')';
  if(b.type==='photo'&&PHOTO) return 'url("'+PHOTO+'") center/cover no-repeat';
  return '';
}
function applyLook(){
  var c=hexRgb(C.accent)||[52,199,89];
  var lt=rgb(mix(c,[0,0,0],.28)),dk=rgb(mix(c,[255,255,255],.1));
  var light='--tint:'+rgb(c)+';--tint-text:'+lt+';--tint-weak:rgba('+c.join(',')+',.16)';
  var dark='--tint:'+dk+';--tint-text:'+dk+';--tint-weak:rgba('+mix(c,[255,255,255],.1).join(',')+',.22)';
  var st=document.getElementById('look');
  if(!st){st=document.createElement('style');st.id='look';document.body.appendChild(st)}
  st.textContent=':root{'+light+'}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){'+dark+'}}:root[data-theme="dark"]{'+dark+'}';
  var r=document.documentElement;
  if(C.theme==='light'||C.theme==='dark') r.setAttribute('data-theme',C.theme);else r.removeAttribute('data-theme');
  var css=bgCss();
  $('#bg').style.background=css;
  r.classList.toggle('hasbg',!!css);
  r.style.setProperty('--veil',String((Number(C.veil)||0)/100));
}

/* ---------- dieta d'esempio ---------- */
function exampleDiet(){
  var lunch=[[['Pasta integrale',80,'g'],['Passata di pomodoro',100,'g'],['Parmigiano Reggiano',10,'g']],[['Riso basmati',80,'g'],['Zucchine',200,'g'],['Olio extravergine d\'oliva',10,'g']],[['Pane integrale',100,'g'],['Tonno al naturale',80,'g'],['Insalata mista',100,'g']]];
  var dinner=[[['Petto di pollo',150,'g'],['Spinaci',200,'g'],['Pane integrale',50,'g']],[['Merluzzo',180,'g'],['Patate',200,'g'],['Pomodori',100,'g']],[['Uova',2,'pz'],['Broccoli',200,'g'],['Pane integrale',50,'g']]];
  var days={};
  function mk(a){return a.map(function(x){return {id:newId(),food:x[0],qty:x[1],unit:x[2],note:''}})}
  for(var k=0;k<7;k++){days[k]={meals:[
    {name:'Colazione',items:mk([['Latte parzialmente scremato',200,'ml'],['Fette biscottate integrali',30,'g'],['Marmellata',15,'g']])},
    {name:'Spuntino',items:mk([['Mela',150,'g'],['Mandorle',15,'g']])},
    {name:'Pranzo',items:mk(lunch[k%3])},
    {name:'Cena',items:mk(dinner[(k+1)%3])}]}}

function normalizeDiet(parts){

var MEAL_RE=/^(prima\s+colazione|colazione|spuntino(?:\s+(?:mattina|mattutino|pomeriggio|pomeridiano|serale|sera))?|break|pranzo|merenda|cena|dopo\s*cena|pre\s*-?\s*nanna|post\s*-?\s*cena|snack|(?:pasto|spuntino)\s*\d)\b/i;

var UNIT_RE='(kg|gr|g|grammi|ml|cl|dl|l|litri|pz|pezzi|pezzo|fette|fetta|cucchiaini|cucchiaino|cucchiai|cucchiaio|vasetto|vasetti|tazza|tazze|bicchiere|bicchieri|porzione|porzioni|scatoletta|bustina|bustine)';

function dayIdx(w){var n=w.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').slice(0,3);return ['lun','mar','mer','gio','ven','sab','dom'].indexOf(n)}

  var found=[],m;DAY_RE.lastIndex=0;
  while((m=DAY_RE.exec(l))) found.push(dayIdx(m[1]));
  if(!found.length) return null;
  var rest=l.replace(DAY_RE,' ').replace(/(?<![\p{L}])(dal|al|e|ed|giorno|giorni|di)(?![\p{L}])/giu,' ').replace(/[\s\-–,.\/]+/g,' ').trim();
  if(rest.length>0&&!/^(settimana|piano|dieta)?$/i.test(rest)) return null;

function cleanFood(s){

    if(unit==='kg'){qty*=1000;unit='g'}else if(unit==='cl'){qty*=10;unit='ml'}else if(unit==='dl'){qty*=100;unit='ml'}else if(unit==='l'){qty*=1000;unit='ml'}

    else if(/pranzo/.test(low)) nm='Pranzo';
    else if(/cena|sera|nanna/.test(low)) nm='Cena';
    else nm=capFirst(low);
    meal=cur.meals.find(function(x){return x.name===nm});
    if(!meal){meal={name:nm,items:[]};cur.meals.push(meal)}
  }
  for(var li=0;li<lines.length&&!stop;li++){
    var line=lines[li];
    if(/settimana\s*(2|due|b)\b|\b(2|ii|b)\s*[°ªa]?\s*settimana/i.test(line)&&sawDay&&cur&&cur.meals.length){break}
    var dh=dayHeader(line);
    if(dh){
      sawDay=true;
      var firstNew=dh.some(function(d){return !seen[d]});
      if(!firstNew&&cur&&cur.meals.length){break}
      dh.forEach(function(d){seen[d]=1});
      curDays=dh;cur=ensure(dh);meal=null;continue;
    }
    var mm=MEAL_RE.exec(line);
    if(mm){
      var after=line.slice(mm[0].length).replace(/^[\s:;\-–.()0-9:hH]*?(?=[A-Za-zÀ-ÿ0-9]|$)/,'');
      var head=line.slice(0,mm[0].length);
      openMeal(head);
      var tail=line.slice(mm[0].length).replace(/^\s*(?:\(?\s*(?:ore\s*)?\d{1,2}[:.]\d{2}\s*\)?)?\s*[:\-–]?\s*/,'');
      if(!tail||/^[\s:.\-–()]*$/.test(tail)) continue;
      line=tail;
    }
    if(!meal){
      if(!/\d/.test(line)&&!/^[\p{L}\s,'’\-]{3,40}$/u.test(line)) continue;
      if(!/\d\s*(g|gr|ml|pz)\b/i.test(line)) continue;
      openMeal('Pasto');
    }
    if(/^(note|nota|avvertenze|consigli|importante|bere|acqua\b|totale|kcal|energia|pagina|page|dott|dr\.|paziente|data\b|peso\b|altezza\b)/i.test(line)) continue;
    if(/^(\d+\s*(\/\s*\d+)?|pag\.?\s*\d+.*)$/i.test(line)) continue;
    var alt=/^(oppure|ovvero|in alternativa|alternativa|o)\b[\s:.\-–]*(.*)$/i.exec(line);
    if(alt&&meal.items.length){
      var last=meal.items[meal.items.length-1];
      var a=cleanFood(alt[2]);if(a) last.note=(last.note?last.note+'; ':'')+'In alternativa: '+a;
      continue;
    }
    var pieces=line.split(/\s+\+\s+|\s*;\s*/);
    pieces.forEach(function(p){
      if(p.length>90) return;
      var it=parseItem(p);if(it) meal.items.push(it);
    });
  }
  var out=[];
  sections.forEach(function(s){
    var ORD=['Colazione','Spuntino','Pranzo','Merenda','Cena'];
    s.meals.sort(function(x,y){var i=ORD.indexOf(x.name),j=ORD.indexOf(y.name);return (i<0?9:i)-(j<0?9:j)});
    var meals=s.meals.filter(function(m){return m.items.length}).map(function(m){return {meal:m.name,items:m.items}});
    if(!meals.length) return;
    s.days.forEach(function(d){out.push({day:DAY_NAMES[d],meals:meals})});
  });
  return normalizeDiet([{days:out}]);
}

/* ---------- libri di lettura (PDF e OCR) inclusi nell'app ---------- */
var libP={},STAGE='';
function tmo(promise,ms,stage){
  STAGE=stage;
  return new Promise(function(res,rej){
    var t=setTimeout(function(){rej({code:'timeout',stage:stage})},ms);
    var ab=function(){clearTimeout(t);rej({code:'cancelled'})};
    if(ctl&&ctl.signal) ctl.signal.addEventListener('abort',ab,{once:true});
    Promise.resolve(promise).then(function(v){clearTimeout(t);res(v)},function(e){clearTimeout(t);rej(e&&e.code?e:{code:'fail',stage:stage,msg:String(e&&e.message||e)})});
  });
}
function loadScript(src){
  if(libP[src]) return libP[src];
  return libP[src]=new Promise(function(res,rej){
    var s=document.createElement('script');s.src=src;s.onload=res;s.onerror=function(){delete libP[src];rej({code:'nolib'})};
    document.head.appendChild(s);
  });
}
function absUrl(p){return new URL(p,location.href).href}
async function getPdfJs(){
  await tmo(loadScript('lib/pdf.min.js'),20000,'caricamento del lettore PDF');
  if(!window.pdfjsLib) throw {code:'nolib'};
  window.pdfjsLib.GlobalWorkerOptions.workerSrc=absUrl('lib/pdf.worker.min.js');
  return window.pdfjsLib;
}
var ocrW=null;
async function getOcr(){
  if(ocrW) return ocrW;
  await tmo(loadScript('lib/tess/tesseract.min.js'),20000,'caricamento del lettore di foto');
  if(!window.Tesseract) throw {code:'nolib'};
  try{
    ocrW=await tmo(window.Tesseract.createWorker('ita',1,{workerPath:absUrl('lib/tess/worker.min.js'),corePath:absUrl('lib/tess'),langPath:absUrl('lib/tess'),workerBlobURL:false,gzip:true,cacheMethod:'none'}),90000,'avvio del riconoscimento testo');
  }catch(e){if(e&&e.code==='timeout'||e&&e.code==='cancelled') throw e;throw {code:'fail',stage:'avvio del riconoscimento testo',msg:String(e&&e.message||e)}}
  return ocrW;
}
async function ocrCanvas(cv){
  var w=await getOcr();
  var r=await tmo(w.recognize(cv),120000,'riconoscimento del testo dalla foto');
  return (r&&r.data&&r.data.text)||'';
}
function imageToCanvas(file,max){
  return new Promise(function(res,rej){
    var u=URL.createObjectURL(file),i=new Image();
    i.onload=function(){
      var W=i.naturalWidth||i.width,H=i.naturalHeight||i.height,s=Math.min(1,max/Math.max(W,H)),c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(W*s));c.height=Math.max(1,Math.round(H*s));
      var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(i,0,0,c.width,c.height);
      URL.revokeObjectURL(u);res(c);
    };
    i.onerror=function(){URL.revokeObjectURL(u);rej({code:'read'})};
    i.src=u;
  });
}
function linesFromPdfPage(content){
  var rows=[];
  content.items.forEach(function(it){
    if(!it.str||!it.str.trim()) return;
    var y=it.transform[5],x=it.transform[4],r=rows.find(function(q){return Math.abs(q.y-y)<3});
    if(!r){r={y:y,parts:[]};rows.push(r)}
    r.parts.push({x:x,s:it.str,w:it.width||0});
  });
  rows.sort(function(a,b){return b.y-a.y});
  return rows.map(function(r){
    r.parts.sort(function(a,b){return a.x-b.x});
    var out='',end=null;
    r.parts.forEach(function(p){out+=(end!==null&&p.x-end>1.5?' ':'')+p.s;end=p.x+p.w});
    return out;
  }).join('\n');
}
async function pdfToText(file,signal,note){
  var lib=await getPdfJs(),buf=await tmo(file.arrayBuffer(),30000,'lettura del file');
  var doc=await tmo(lib.getDocument({data:buf}).promise,30000,'apertura del PDF');
  var all=[];
  for(var p=1;p<=doc.numPages;p++){
    if(signal.aborted) throw {code:'cancelled'};
    note('Leggo la pagina '+p+' di '+doc.numPages+'…');
    var page=await tmo(doc.getPage(p),30000,'lettura pagina '+p),txt=linesFromPdfPage(await tmo(page.getTextContent(),30000,'testo della pagina '+p));
    if(txt.replace(/\s/g,'').length<40){
      note('Pagina '+p+' di '+doc.numPages+': riconosco il testo dall\'immagine…');
      var vp=page.getViewport({scale:2.2}),cv=document.createElement('canvas');
      cv.width=Math.round(vp.width);cv.height=Math.round(vp.height);
      await tmo(page.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise,60000,'disegno della pagina '+p);
      txt=await ocrCanvas(cv);
    }
    all.push(txt);
  }
  return all.join('\n');
}
function errCopy(code){
  switch(code){
    case 'nolib':return 'Questa versione dell\'app non include il lettore di PDF e foto. Usa "Incolla il testo" oppure inserisci gli alimenti a mano.';
    case 'ocr':return 'Il riconoscimento del testo dalle foto non è partito. Riprova, oppure incolla il testo.';
    case 'no_pages':return 'Nei file scelti non ci sono pagine leggibili.';
    case 'read':return 'Non riesco a leggere uno dei file scelti. Riprova.';
    case 'empty':return 'Ho letto il documento ma non ci ho trovato pasti con quantità. Prova con foto più nitide e dritte, oppure incolla il testo.';
    case 'timeout':return 'Si è bloccato durante: '+STAGE+'. Scrivimi questa frase esatta.';
    case 'fail':return 'Errore durante: '+STAGE+' ('+(S.errmsg||'')+'). Scrivimi questa frase esatta.';
    default:return 'Qualcosa è andato storto durante la lettura. Riprova.';
  }
}
async function runImport(src){
  ctl=new AbortController();var signal=ctl.signal;
  openSheet('busy');setBusy('Preparo i file…');
  try{
    var text='';
    if(src.text){text=src.text}
    else{
      var files=src.files.filter(function(f){return f.type==='application/pdf'||/^image\//.test(f.type)||/\.(pdf|jpe?g|png|webp|heic|heif)$/i.test(f.name)});
      if(!files.length) throw {code:'no_pages'};
      for(var i=0;i<files.length;i++){
        if(signal.aborted) throw {code:'cancelled'};
        var f=files[i],isPdf=f.type==='application/pdf'||/\.pdf$/i.test(f.name),pre='File '+(i+1)+' di '+files.length+': ';
        if(isPdf){text+='\n'+await pdfToText(f,signal,function(m){setBusy(pre+m)})}
        else{
          setBusy(pre+'riconosco il testo…');
          var cv=await tmo(imageToCanvas(f,2400),30000,'apertura della foto');
          text+='\n'+await ocrCanvas(cv);
        }
      }
    }
    setBusy('Ordino pasti e quantità…');
    await new Promise(function(r){setTimeout(r,30)});
    var diet=parseDietText(text);
    if(!diet){S.lastText=text;throw {code:'empty'}}
    S.diet=diet;S.checks={};S.tab='dieta';S.edit=true;S.banner=true;S.sel=0;
    saveData();closeSheet();window.scrollTo(0,0);render();
  }catch(e){
    var code=e&&e.code;
    if(code==='cancelled'){closeSheet();toast('Importazione annullata');return}
    S.errmsg=e&&e.msg||'';if(e&&e.stage) STAGE=e.stage;
    if(!code) try{console.error('import',e&&e.stack||e)}catch(x){}
    S.err=errCopy(code);openSheet('error');
  }finally{ctl=null}
}

function locate(id){
  if(!S.diet) return null;
  for(var k in S.diet.days){var day=S.diet.days[k];
    for(var mi=0;mi<day.meals.length;mi++){var m=day.meals[mi],ii=m.items.findIndex(function(x){return x.id===id});if(ii>=0) return {day:day,m:m,mi:mi,ii:ii,item:m.items[ii]}}}
  return null;
}
function toggle(id,row){
  if(row&&row.classList.contains('leaving')) return;
  var key=iso(dates()[S.sel])+'|'+id;
  function apply(){if(S.checks[key]) delete S.checks[key];else S.checks[key]=1;saveData();render()}
  if(row&&!reduced&&!S.checks[key]){row.classList.add('leaving');setTimeout(apply,170)}else apply();
}
function focusField(id,f){setTimeout(function(){var e=document.getElementById('f-'+id+'-'+f);if(e)e.focus()},30)}
function doAct(el){
  var a=el.dataset.act;
  if(a==='import'){openImport()}
  else if(a==='goto-settings'){closeSheet();S.tab='impostazioni';window.scrollTo(0,0);render()}
  else if(a==='pick-text'){openSheet('text')}
  else if(a==='sheet-close'){closeSheet()}
  else if(a==='retry'){openImport()}
  else if(a==='stop'){if(ctl) ctl.abort()}
  else if(a==='run-text'){var t=(($('#diet-text')||{}).value||'').trim();if(t.length<10){toast('Incolla prima il testo della dieta');return}runImport({text:t})}
  else if(a==='example'){S.diet=exampleDiet();S.checks={};saveData();render()}
  else if(a==='edit'){S.edit=!S.edit;if(!S.edit)S.banner=false;render()}
  else if(a==='reset'){S.checks={};saveData();render();toast('Spunte azzerate')}
  else if(a==='rmphoto'){PHOTO='';try{localStorage.removeItem(K_PHOTO)}catch(e){}C.bg.type='none';saveCfg();applyLook();render()}
  else if(a==='wipe'){
    if(S.confirm!=='wipe'){S.confirm='wipe';render();setTimeout(function(){if(S.confirm==='wipe'){S.confirm='';if(S.tab==='impostazioni')render()}},4000)}
    else{S.confirm='';S.diet=null;S.checks={};saveData();render();toast('Dati cancellati')}
  }
  else if(a==='del'){var loc=locate(el.closest('[data-id]').dataset.id);if(loc){loc.m.items.splice(loc.ii,1);if(!loc.m.items.length)loc.day.meals.splice(loc.mi,1);saveData();render()}}
  else if(a==='add'){var day=S.diet.days[el.dataset.k],m=day&&day.meals[+el.dataset.m];if(m){var it={id:newId(),food:'',qty:null,unit:'g',note:''};m.items.push(it);saveData();render();focusField(it.id,'food')}}
  else if(a==='addmeal'){var k=el.dataset.k,d2=S.diet.days[k]||(S.diet.days[k]={meals:[]}),it2={id:newId(),food:'',qty:null,unit:'g',note:''};d2.meals.push({name:'Pasto',items:[it2]});saveData();render();focusField(it2.id,'food')}
}
document.addEventListener('click',function(e){
  var t=e.target;
  var tab=t.closest('[data-tab]');if(tab){S.tab=tab.dataset.tab;S.edit=false;S.banner=false;S.confirm='';window.scrollTo(0,0);render();return}
  var sel=t.closest('[data-sel]');if(sel){S.sel=+sel.dataset.sel;render();return}
  var col=t.closest('[data-col]');if(col){C.accent=col.dataset.col;saveCfg();applyLook();render();return}
  var th=t.closest('[data-theme-set]');if(th){C.theme=th.dataset.themeSet;saveCfg();applyLook();render();return}
  var bg=t.closest('[data-bg]');
  if(bg){
    var v=bg.dataset.bg;
    if(v==='none') C.bg.type='none';
    else if(v==='custom') C.bg.type='custom';
    else{C.bg.type='preset';C.bg.preset=parseInt(v.slice(1),10)}
    saveCfg();applyLook();render();return;
  }
  var act=t.closest('[data-act]');if(act){doAct(act);return}
  var row=t.closest('.item[data-id]');if(row){toggle(row.dataset.id,row)}
});
document.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('item')){e.preventDefault();toggle(e.target.dataset.id,e.target)}});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='cust'){C.accent=t.value;saveCfg();applyLook();return}
  if(t.id==='bgc1'||t.id==='bgc2'){C.bg[t.id==='bgc1'?'c1':'c2']=t.value;C.bg.type='custom';saveCfg();applyLook();return}
  if(t.id==='veil'){C.veil=Number(t.value);var v=$('#veilv');if(v)v.textContent=Math.round(C.veil)+'%';saveCfg();applyLook();return}
  var f=t.closest&&t.closest('[data-f]');if(!f) return;
  var rowEl=f.closest('[data-id]');if(!rowEl) return;
  var loc=locate(rowEl.dataset.id);if(!loc) return;
  var key=f.dataset.f;
  if(key==='qty'){var s=f.value.trim().replace(',','.');if(s==='') loc.item.qty=null;else if(Number.isFinite(Number(s))) loc.item.qty=Number(s)}
  else loc.item[key]=f.value;
  saveData();
});
document.addEventListener('change',async function(e){
  var t=e.target;
  if(t&&t.id==='file'){var files=Array.prototype.slice.call(t.files||[]);t.value='';if(files.length) runImport({files:files})}
  else if(t&&t.id==='bgfile'){
    var f=t.files&&t.files[0];t.value='';if(!f) return;
    try{
      var d=await readImage(f,1400,.8);
      try{localStorage.setItem(K_PHOTO,d)}catch(err){toast('La foto è troppo grande per la memoria');return}
      PHOTO=d;C.bg.type='photo';saveCfg();applyLook();render();
    }catch(err){toast('Non riesco a leggere questa foto')}
  }
});
document.addEventListener('visibilitychange',function(){if(!document.hidden&&!S.edit&&!S.sheet&&S.tab!=='impostazioni'){prune();render()}});

loadAll();prune();applyLook();render();
})();
